[project]
name = "pos-service"
version = "0.1.0"
description = "POS"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.5",
    "ncjishaku>=3.1.0",
    "nextcord>=3.2.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
]

[project.scripts]
pos-service = "pos_service:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
